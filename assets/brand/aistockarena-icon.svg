<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AI Stock Arena icon</title>
  <desc id="desc">A dark rounded square with a cyan arena ring, magenta market line, and white AI monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="18" x2="226" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#111a30"/>
      <stop offset="1" stop-color="#1b2c4c"/>
    </linearGradient>
    <linearGradient id="ring" x1="42" y1="52" x2="214" y2="210" gradientUnits="userSpaceOnUse">
